name: Deploy to server

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/wow11one/dih

jobs:
  # The server has ~2 GB RAM, not enough for `next build`, so the image is
  # built on GitHub's runner and pushed to GHCR; the server only pulls it.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIH_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: DIH_IMAGE,GHCR_USER,GHCR_TOKEN,POSTGRES_PASSWORD,PAYLOAD_SECRET,NEXT_PUBLIC_SERVER_URL,S3_ENDPOINT,S3_BUCKET,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY
          script: |
            set -e
            # Stop before touching anything if the required secrets are missing.
            for name in POSTGRES_PASSWORD PAYLOAD_SECRET NEXT_PUBLIC_SERVER_URL; do
              if [ -z "$(printenv $name)" ]; then
                echo "GitHub secret $name is not set"; exit 1
              fi
            done

            cd ${{ secrets.PROJECT_PATH }}
            # Only docker-compose.yml is needed from the repo now.
            git pull --rebase

            # .env is generated from GitHub secrets on every deploy.
            umask 077
            cat > .env <<EOF
            DIH_IMAGE=$DIH_IMAGE
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            PAYLOAD_SECRET=$PAYLOAD_SECRET
            NEXT_PUBLIC_SERVER_URL=$NEXT_PUBLIC_SERVER_URL
            S3_ENDPOINT=$S3_ENDPOINT
            S3_BUCKET=$S3_BUCKET
            S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY
            S3_REGION=auto
            S3_PREFIX=dih
            EOF

            # Pull first: if it fails, the old container keeps serving the site.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull app db
            docker logout ghcr.io

            # One-time: remove the old container started with `docker run`
            # (not managed by compose) that holds the `dih` name.
            if [ -z "$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' dih 2>/dev/null)" ]; then
              docker rm -f dih 2>/dev/null || true
            fi
            docker compose up -d --no-build

            # Make sure the new version actually answers.
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://localhost:3005/; then
                echo "Site is up"
                docker image prune -f
                exit 0
              fi
              sleep 2
            done
            echo "Site did not come up, last logs:"
            docker compose logs --tail=100 app
            exit 1
